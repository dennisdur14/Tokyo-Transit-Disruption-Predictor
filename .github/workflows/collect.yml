name: Collect Tokyo transit snapshots

# Every 15 minutes, save one snapshot of Toei bus positions/delays, ODPT rail bulletins and
# Tokyo weather, and commit it to the `data` branch (created automatically on the first run).
# Works without any secrets; add an ODPT_API_KEY repository secret to also collect JR East,
# Tokyo Metro and Tokyu lines.
#
# GitHub may delay or skip scheduled runs when busy, so expect some gaps; the pipeline
# handles them. Public repositories get these minutes free. In a private repository, change
# the schedule to "*/30 * * * *" to stay inside the free monthly minutes.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write # needed to push to the data branch

concurrency:
  group: collect-snapshots
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-collect.txt

      - name: Install collector dependencies
        run: pip install -r requirements-collect.txt

      - name: Get today's date in Tokyo
        id: date
        run: echo "today=$(TZ=Asia/Tokyo date +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Reuse today's Toei timetable if a previous run downloaded it
        uses: actions/cache@v6
        with:
          path: .gtfs-cache
          key: toei-gtfs-${{ steps.date.outputs.today }}

      - name: Check out the data branch (or start it on the first run)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repo="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$repo" data > /dev/null; then
            git clone --quiet --depth 1 --branch data --single-branch "$repo" datastore
          else
            git init --quiet -b data datastore
            git -C datastore remote add origin "$repo"
          fi

      - name: Collect one snapshot
        env:
          ODPT_API_KEY: ${{ secrets.ODPT_API_KEY }} # optional
        run: python -m src.collect --out datastore/raw --gtfs-cache .gtfs-cache

      - name: Commit the snapshot to the data branch
        run: |
          cd datastore
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add raw
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          git commit --quiet -m "Snapshot $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M') JST"
          git push --quiet origin data
