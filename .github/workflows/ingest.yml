name: Scheduled Tokyo Transit Ingestion

on:
  schedule:
    # Poll every 10 minutes during Tokyo peak & daytime hours (UTC 21:00 - 15:00 = JST 06:00 - 00:00)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  collect-telemetry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Poll ODPT Rail Alerts, Toei Bus GTFS-RT & Tokyo Weather
        env:
          ODPT_API_KEY: ${{ secrets.ODPT_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m src.ingest --mode live
